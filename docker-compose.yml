services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linepe
      POSTGRES_USER: linepe
      POSTGRES_PASSWORD: linepe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linepe -d linepe"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: https://line-pe.vercel.app
      CLIENT_URLS: https://line-pe.vercel.app
      COOKIE_SAME_SITE: none
      COOKIE_SECURE: "true"
      MONGODB_URI: mongodb://User1ChatApp:aJ1FgrfQdIubwDfM@ac-hvaxzbh-shard-00-00.ae3j1lu.mongodb.net:27017,ac-hvaxzbh-shard-00-01.ae3j1lu.mongodb.net:27017,ac-hvaxzbh-shard-00-02.ae3j1lu.mongodb.net:27017/?ssl=true&replicaSet=atlas-ksez5y-shard-0&authSource=admin&appName=Cluster0
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://linepe:linepe@postgres:5432/linepe
      JWT_SECRET: 78c2405623cf5315ab2e92662cf58b3907619dd9bfbc97a8b2a2f20f55e606b6e48e1e1bb7a826080b50c72257ff0707
